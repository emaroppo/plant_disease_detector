# One labelling job: PlantVillage, as species and disease together.
#
# Both halves live in one label set on purpose. The species is a fact about
# the sample that a model may be told; the disease is what it is asked for.
# Which is which is a question about the job, and today strata has no way to
# say it — a model reads its target and decides for itself. That is the gap
# arm C needs closed.

name = "plants"

[label_config]
template = "image_classification"
# Multi-label: every sample asserts exactly two of these, its species and
# its disease. 'healthy' is one of the 21 disease values rather than the
# absence of one — a leaf someone looked at and found well is an answer.
choice = "multiple"
classes = [
    # Species (14)
    "Apple",
    "Blueberry",
    "Cherry_(including_sour)",
    "Corn_(maize)",
    "Grape",
    "Orange",
    "Peach",
    "Pepper,_bell",
    "Potato",
    "Raspberry",
    "Soybean",
    "Squash",
    "Strawberry",
    "Tomato",
    # Disease, including healthy (21)
    "Apple_scab",
    "Bacterial_spot",
    "Black_rot",
    "Cedar_apple_rust",
    "Cercospora_leaf_spot Gray_leaf_spot",
    "Common_rust_",
    "Early_blight",
    "Esca_(Black_Measles)",
    "Haunglongbing_(Citrus_greening)",
    "Late_blight",
    "Leaf_Mold",
    "Leaf_blight_(Isariopsis_Leaf_Spot)",
    "Leaf_scorch",
    "Northern_Leaf_Blight",
    "Powdery_mildew",
    "Septoria_leaf_spot",
    "Spider_mites Two-spotted_spider_mite",
    "Target_Spot",
    "Tomato_Yellow_Leaf_Curl_Virus",
    "Tomato_mosaic_virus",
    "healthy",
]

[data]
type = "image"
source_root = "data/source"
root = "data/raw"
# Named rather than inferred. Resolution reads the first file in sorted
# order, and this corpus holds four extensions, so naming it removes the
# question entirely.
preparer = "plantvillage"

[catalog]
# Which catalog on this host, by the name it has in config.toml. Stated
# rather than left to the host's default: a project moved to another machine
# expects a catalog of this name there, and gets an error rather than
# somebody else's corpus if there is none.
name = "demo"
label_set = "plants"
collections = ["plantvillage"]

[model]
ref = "plant-disease"

[model.params]
# 'flat' is arm A: one head over every (species, disease) pair, the 38-way
# composite the paper used. 'disease' is arm B, the same trunk with no
# species information at all. They must not be compared on one axis — the
# class counts differ, so the gap between them is arithmetic.
arm = "flat"
# The species half of the label set, restated because the label set cannot
# say which of its 35 classes are species. Kept in the same order as the
# classes list above, so a diff shows a drift between the two.
species = [
    "Apple",
    "Blueberry",
    "Cherry_(including_sour)",
    "Corn_(maize)",
    "Grape",
    "Orange",
    "Peach",
    "Pepper,_bell",
    "Potato",
    "Raspberry",
    "Soybean",
    "Squash",
    "Strawberry",
    "Tomato",
]
epochs = 10
batch_size = 64
image_size = 256
# Decoding 43,000 JPEGs an epoch is the real cost; the network is small
# enough that one loader thread starves the GPU.
num_workers = 8
dropout = 0.75
lr = 0.001
weight_decay = 0.0001
